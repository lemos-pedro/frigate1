auth:
  enabled: true

mqtt:
  enabled: false

detectors:
  cpu_detector:
    type: cpu

record:
  enabled: true
  alerts:
    retain:
      days: 1
      mode: motion
  detections:
    retain:
      days: 1
      mode: motion
  continuous:
    days: 7

snapshots:
  enabled: true
  retain:
    default: 14

go2rtc:
