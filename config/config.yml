# =============================================================================
#  Frigate NVR - config.yml  (versão leve: só gravação, sem IA)
#  Password RTSP vem do .env (FRIGATE_RTSP_PASSWORD) via compose.
# =============================================================================
version: 0.18-0

mqtt:
  enabled: false

detectors:
  cpu_detector:
    type: cpu

ui:
  timezone: Africa/Luanda
  time_format: 24hour

profiles:
  viewer:
    friendly_name: viewer

# ---- Desligar tudo o que cria processos/threads extra ----
audio:
  enabled: false
semantic_search:
  enabled: false
birdseye:
  enabled: false
snapshots:
  enabled: false

# ---- Defaults herdados por todas as câmaras ----
ffmpeg:
  input_args: preset-rtsp-restream

detect:
  enabled: false
  width: 1280
  height: 720
  fps: 5

# Gravação contínua. Ajusta os dias ao espaço em disco (ver nota).
record:
  enabled: true
  continuous:
    days: 3

