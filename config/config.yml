cameras:
  URB_KATAPA:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/URB_KATAPA
          input_args: preset-rtsp-restream
          roles: [record, detect]
    detect:
      enabled: true
      width: 1280      # <-- detecao a 720p em vez da resolucao total
      height: 720
      fps: 5           # <-- 5 fps chega para detetar pessoas
    audio:
      listen:
        - fire_alarm
    zones:
      caixa_1:
        coordinates: 0.373,0.476,0.368,0.554,0.41,0.554,0.406,0.482
        enabled: true
        inertia: 3
        loitering_time: 0
        friendly_name: caixa 1
    record:
      continuous:
        days: 7
    onvif:
      user: Ariclene.lemos
      password: Towercore2026

  MU_CAMBAX:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/MU_CAMBAX
          input_args: preset-rtsp-restream
